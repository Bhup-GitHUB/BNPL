services:
  postgres:
    image: postgres:16
    container_name: bnpl-postgres
    environment:
      POSTGRES_DB: bnpl
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bnpl"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - bnpl-postgres-data:/var/lib/postgresql/data

volumes:
  bnpl-postgres-data:
